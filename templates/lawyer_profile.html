<!DOCTYPE html>
<html>

<head>

<title>Lawyer Profile</title>

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#2c3e50,#4ca1af);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:40px;
width:420px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
text-align:center;
}

.name{
font-size:26px;
font-weight:bold;
margin-bottom:10px;
}

.info{
margin:8px 0;
}

.btn{
display:inline-block;
margin-top:20px;
background:#2c3e50;
color:white;
padding:12px 18px;
border-radius:6px;
text-decoration:none;
}

.btn:hover{
background:#1a252f;
}

</style>

</head>

<body>

<div class="card">
    <h2>{{ lawyer.name }}

{% if lawyer.is_verified %}
<span style="color:green;">✔ Verified</span>
{% endif %}

</h2>

<p>⭐ Rating: {{ lawyer.rating }} ({{ lawyer.total_reviews }} reviews)</p>

<p>📍 {{ lawyer.location }}</p>
<p>💼 {{ lawyer.experience }} years</p>
<p>💰 Fee: ₹{{ lawyer.consultation_fee }}</p>

<a href="{{ lawyer.certificate_file.url }}" target="_blank">
View Certificate
</a>

<button>Book Consultation</button>
<button>Chat Now</button>

</a>

</div>

</body>

</html>
