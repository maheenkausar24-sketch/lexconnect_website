<style>

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* MAIN BOX */
.chat-container {
    width: 420px;
    height: 650px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.2);
    border-radius: 25px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 25px 60px rgba(0,0,0,0.3);
}

/* HEADER */
.chat-header {
    background: rgba(0,0,0,0.2);
    color: white;
    padding: 18px;
    font-size: 18px;
    font-weight: bold;
}

/* CHAT AREA */
.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

/* MESSAGES */
.message {
    padding: 10px 15px;
    border-radius: 18px;
    margin-bottom: 10px;
    max-width: 70%;
    font-size: 14px;
    animation: fadeIn 0.3s ease;
}

.user {
    background: #0084ff;
    color: white;
    margin-left: auto;
}

.lawyer {
    background: white;
    color: black;
}

/* INPUT BAR */
.chat-input {
    display: flex;
    align-items: center;
    padding: 10px;
    gap: 8px;
    background: rgba(255,255,255,0.3);
}

/* INPUT */
.chat-input input[type="text"] {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
    outline: none;
}

/* ICON BUTTONS */
.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

/* BUTTON COLORS */
.mic-btn {
    background: #ff4d4d;
    color: white;
}

.file-btn {
    background: #ddd;
}

.send-btn {
    background: #0084ff;
    color: white;
}

/* HOVER */
.icon-btn:hover {
    transform: scale(1.1);
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity:0; transform: translateY(5px);}
    to {opacity:1;}
}

</style>

<div class="chat-container">

<div class="chat-header">
Chat with {{ chat.lawyer.name }}
</div>

<div class="chat-box" id="chat-box">

{% for msg in messages %}
<div class="message {% if msg.sender == request.user %}user{% else %}lawyer{% endif %}">
    {{ msg.text }}

    {% if msg.file %}
        <br>
        📎 <a href="{{ msg.file.url }}">File</a>
    {% endif %}
</div>
{% endfor %}

</div>

<form method="POST" enctype="multipart/form-data" class="chat-input">
{% csrf_token %}

<button type="button" class="icon-btn mic-btn" onclick="startVoice()">🎤</button>

<input type="text" name="text" id="messageInput" placeholder="Type a message...">
<input type="hidden" name="dummy">

<label class="icon-btn file-btn">
    📎
    <input type="file" name="file">
</label>

<button type="submit" class="icon-btn send-btn">➤</button>

</form>

</div>

<script>

function startVoice() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

    recognition.lang = "en-IN";  // Indian English
    recognition.start();

    recognition.onresult = function(event) {
        document.getElementById("messageInput").value =
            event.results[0][0].transcript;
    };

    recognition.onerror = function() {
        alert("Voice recognition not supported in this browser");
    };
}

let box = document.getElementById("chat-box");
box.scrollTop = box.scrollHeight;

</script>
